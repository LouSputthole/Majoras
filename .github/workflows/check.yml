name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check rendered production build and GLB export
        run: |
          npm run preview > ../evidence-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173 > /dev/null && break; sleep 1; done
          npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-evidence
          path: evidence/
